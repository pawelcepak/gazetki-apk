name: Update leaflet data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_leaflets.py'
      - '.github/workflows/update-leaflets.yml'
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch current leaflet metadata and page images
        run: python scripts/update_leaflets.py
      - name: Validate JSON
        run: python -m json.tool data/leaflets.json >/dev/null
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/leaflets.json; then
            echo "No leaflet changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leaflets.json
          git commit -m "data: refresh leaflet metadata and pages"
          git push
