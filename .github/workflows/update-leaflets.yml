name: Update leaflet data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_leaflets.py'
      - '.github/workflows/update-leaflets.yml'
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: leaflet-data-main
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch current leaflets and real product offers
        run: python scripts/update_leaflets.py
      - name: Validate generated data
        run: |
          python -m json.tool data/leaflets.json >/dev/null
          python -m json.tool data/products.json >/dev/null
          python - <<'PY'
          import json,re
          l=json.load(open('data/leaflets.json'))
          p=json.load(open('data/products.json'))
          assert len(l.get('leaflets',[])) == 3, 'Expected Netto, ALDI and Lidl'
          assert all(x.get('reader')=='images' and x.get('pages') for x in l['leaflets'])
          assert p.get('demo') is False
          products=p.get('products',[])
          assert products, 'No products extracted'
          assert not any(re.fullmatch(r'\d{1,4}[,.]\d{2}\s*zł',x.get('name',''),re.I) for x in products), 'Price parsed as product name'
          print('leaflets',len(l['leaflets']),'products',len(products))
          PY
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/leaflets.json data/products.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leaflets.json data/products.json
          git commit -m "data: refresh leaflets and product offers"
          # Another Pages/UI commit may land while this job is scraping. Rebase
          # the generated-data commit instead of failing with a non-fast-forward.
          git pull --rebase origin main
          git push origin HEAD:main
