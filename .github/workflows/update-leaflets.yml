name: Update leaflet data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_leaflets.py'
      - '.github/workflows/update-leaflets.yml'
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: leaflet-data-main
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Polish OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-pol
      - name: Fetch leaflets, offers and index every page
        run: python scripts/update_leaflets.py
      - name: Validate generated data
        run: |
          python -m json.tool data/leaflets.json >/dev/null
          python -m json.tool data/products.json >/dev/null
          python -m json.tool data/page-index.json >/dev/null
          python - <<'PY'
          import json,re
          l=json.load(open('data/leaflets.json'))
          p=json.load(open('data/products.json'))
          idx=json.load(open('data/page-index.json'))
          assert len(l.get('leaflets',[])) == 3, 'Expected Netto, ALDI and Lidl'
          assert all(x.get('reader')=='images' and x.get('pages') for x in l['leaflets'])
          assert p.get('demo') is False
          products=p.get('products',[])
          assert products, 'No products extracted'
          assert not any(re.fullmatch(r'\d{1,4}[,.]\d{2}\s*zł',x.get('name',''),re.I) for x in products), 'Price parsed as product name'
          expected=sum(len(x['pages']) for x in l['leaflets'])
          pages=idx.get('pages',[])
          assert len(pages)==expected, f'Page index incomplete: {len(pages)}/{expected}'
          searchable=sum(bool(x.get('text')) for x in pages)
          assert searchable >= int(expected*.90), f'OCR coverage too low: {searchable}/{expected}'
          print('leaflets',len(l['leaflets']),'products',len(products),'OCR pages',searchable,'/',expected)
          PY
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/leaflets.json data/products.json data/page-index.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leaflets.json data/products.json data/page-index.json
          git commit -m "data: refresh leaflets, offers and searchable pages"
          git pull --rebase origin main
          git push origin HEAD:main
